version = 1
revision = 3
requires-python = ">=3.12"

[manifest]
members = [
    "g2p",
    "g2p-contract",
    "g2p-kg",
    "g2p-ml",
]

[[package]]
name = "g2p"
version = "0.1.0"
source = { virtual = "." }

[[package]]
name = "g2p-contract"
version = "0.1.0"
source = { editable = "contract" }

[[package]]
name = "g2p-kg"
version = "0.1.0"
source = { editable = "kg" }
dependencies = [
    { name = "g2p-contract" },
]

[package.metadata]
requires-dist = [{ name = "g2p-contract", editable = "contract" }]

[[package]]
name = "g2p-ml"
version = "0.1.0"
source = { editable = "ml" }
dependencies = [
    { name = "g2p-contract" },
]

[package.metadata]
requires-dist = [{ name = "g2p-contract", editable = "contract" }]
